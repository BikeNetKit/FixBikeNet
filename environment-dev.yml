name: fbnenvdev
channels:
  - conda-forge
dependencies:
  - python>=3.12
  - osmnx>=2
  - tqdm
  - bikenetlib

  # Additional to the non-dev env
  - ipykernel
  - ipywidgets
  - pytest
  - pytest-cov
  - sphinx
  - numpydoc
  - myst-nb
  - pre-commit
  - jupyterlab
  - pixi-kernel
  - jupyterlab
  - matplotlib
  - pip:
      # Not available via conda-forge:
      - sphinx-copybutton
      - sphinxext-opengraph
      - furo
      - fixbikenet # For docs, get latest version fast from pypi